name: Production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run production quality gates
        run: npm run quality:release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::881081146494:role/nomad-lens-github-deploy

      - name: Deploy CDK stack
        run: npm run deploy

      - name: Smoke test production
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 https://www.nomad-lens.org/
          curl --fail --silent --show-error --retry 6 --retry-delay 10 https://www.nomad-lens.org/api/livez | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => { const body = JSON.parse(data); if (body.status !== 'ok') process.exit(1); });"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 https://www.nomad-lens.org/api/readyz | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => { const body = JSON.parse(data); if (body.status !== 'ok' || body.checks?.countries?.loaded !== true) process.exit(1); });"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 https://www.nomad-lens.org/api/meta | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => { const body = JSON.parse(data); if (body.status !== 'ok' || body.name !== 'nomad-lens') process.exit(1); });"
